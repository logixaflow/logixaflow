<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D1F3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316" />
      <stop offset="100%" style="stop-color:#FB923C" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#F97316" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>

  <!-- Accent glow lines -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)" opacity="0.8"/>
  <rect x="0" y="398" width="1200" height="2" fill="url(#accent)" opacity="0.8"/>

  <!-- Center glow orb -->
  <circle cx="200" cy="200" r="120" fill="#F97316" opacity="0.04" filter="url(#glow2)"/>
  <circle cx="200" cy="200" r="70" fill="#F97316" opacity="0.08" filter="url(#glow2)"/>

  <!-- Hexagon logo shape -->
  <g transform="translate(140, 131)" filter="url(#glow)">
    <polygon points="60,0 120,34 120,104 60,138 0,104 0,34" fill="none" stroke="#F97316" stroke-width="2" opacity="0.9"/>
    <polygon points="60,15 108,42 108,96 60,123 12,96 12,42" fill="none" stroke="#F97316" stroke-width="1" opacity="0.4"/>
    <line x1="30" y1="69" x2="90" y2="69" stroke="#F97316" stroke-width="2.5" opacity="0.9"/>
    <line x1="60" y1="40" x2="60" y2="100" stroke="#F97316" stroke-width="2.5" opacity="0.9"/>
    <circle cx="60" cy="69" r="8" fill="#F97316" opacity="0.9"/>
    <circle cx="30" cy="69" r="4" fill="#F97316" opacity="0.7"/>
    <circle cx="90" cy="69" r="4" fill="#F97316" opacity="0.7"/>
    <circle cx="60" cy="40" r="4" fill="#F97316" opacity="0.7"/>
    <circle cx="60" cy="100" r="4" fill="#F97316" opacity="0.7"/>
  </g>

  <!-- Main title -->
  <text x="320" y="175" font-family="'Courier New', monospace" font-size="68" font-weight="900" letter-spacing="6" fill="url(#text-grad)" filter="url(#glow)">LOGIXA FLOW</text>

  <!-- Subtitle -->
  <text x="322" y="225" font-family="'Courier New', monospace" font-size="20" letter-spacing="3" fill="#CBD5E1" opacity="0.8">Multi-Agent Workflow Automation &amp; Distributed LLM Routing</text>

  <!-- Tags -->
  <g transform="translate(322, 265)">
    <rect x="0" y="0" width="140" height="28" rx="4" fill="#F97316" opacity="0.15" stroke="#F97316" stroke-width="1" stroke-opacity="0.6"/>
    <text x="70" y="19" font-family="monospace" font-size="12" fill="#F97316" text-anchor="middle" letter-spacing="1">AGENT ROUTING</text>

    <rect x="150" y="0" width="120" height="28" rx="4" fill="#F97316" opacity="0.1" stroke="#F97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="210" y="19" font-family="monospace" font-size="12" fill="#F97316" text-anchor="middle" opacity="0.9" letter-spacing="1">RAG PIPELINES</text>

    <rect x="280" y="0" width="110" height="28" rx="4" fill="#F97316" opacity="0.1" stroke="#F97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="335" y="19" font-family="monospace" font-size="12" fill="#F97316" text-anchor="middle" opacity="0.9" letter-spacing="1">MULTI-NODE</text>

    <rect x="400" y="0" width="130" height="28" rx="4" fill="#F97316" opacity="0.1" stroke="#F97316" stroke-width="1" stroke-opacity="0.4"/>
    <text x="465" y="19" font-family="monospace" font-size="12" fill="#F97316" text-anchor="middle" opacity="0.9" letter-spacing="1">DISTRIBUTED</text>
  </g>

  <!-- Right decorative dots -->
  <g opacity="0.5">
    <circle cx="1050" cy="120" r="3" fill="#F97316"/>
    <circle cx="1080" cy="150" r="2" fill="#F97316" opacity="0.6"/>
    <circle cx="1100" cy="100" r="2" fill="#F97316" opacity="0.4"/>
    <circle cx="1130" cy="200" r="4" fill="#F97316" opacity="0.5"/>
    <circle cx="1070" cy="270" r="2" fill="#F97316" opacity="0.4"/>
    <circle cx="1150" cy="300" r="3" fill="#F97316" opacity="0.3"/>
  </g>

  <!-- Flow lines right side -->
  <g opacity="0.2" stroke="#F97316" stroke-width="1" stroke-dasharray="4,4">
    <line x1="1000" y1="150" x2="1180" y2="150"/>
    <line x1="1000" y1="200" x2="1180" y2="200"/>
    <line x1="1000" y1="250" x2="1180" y2="250"/>
  </g>
</svg>