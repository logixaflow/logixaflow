<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Logixa Flow — Smarter Supply Chain. Limitless Flow.</title>
  <desc id="desc">A premium dark emerald technology banner with the Logixa Flow LF emblem, supply chain network routes, connected AI workflow nodes, and logistics container motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04130F"/>
      <stop offset=".48" stop-color="#08251B"/>
      <stop offset="1" stop-color="#030B09"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A7F3D0"/>
      <stop offset=".52" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E3B2B" stop-opacity=".92"/>
      <stop offset="1" stop-color="#071A14" stop-opacity=".78"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop offset="0" stop-color="#10B981" stop-opacity=".24"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emblem" cx=".38" cy=".28" r=".8">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#064E3B"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6EE7B7" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#A7F3D0" fill-opacity=".18"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- Background and atmospheric depth -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <ellipse cx="280" cy="245" rx="360" ry="300" fill="url(#ambient)"/>
  <ellipse cx="1190" cy="245" rx="410" ry="320" fill="url(#ambient)" opacity=".7"/>
  <path d="M0 408C260 320 420 455 690 365S1190 280 1500 350" fill="none" stroke="#10B981" stroke-opacity=".12" stroke-width="2"/>
  <path d="M0 430C260 342 420 477 690 387S1190 302 1500 372" fill="none" stroke="#A7F3D0" stroke-opacity=".07" stroke-width="1.2"/>

  <!-- Brand emblem -->
  <g transform="translate(92 122)" filter="url(#shadow)">
    <circle cx="112" cy="112" r="116" fill="#10B981" opacity=".14" filter="url(#glow)"/>
    <circle cx="112" cy="112" r="104" fill="none" stroke="#6EE7B7" stroke-width="2.2" opacity=".72"/>
    <circle cx="112" cy="112" r="95" fill="none" stroke="#10B981" stroke-width="1.2" opacity=".7"/>
    <circle cx="112" cy="112" r="90" fill="url(#emblem)"/>
    <circle cx="112" cy="112" r="76" fill="none" stroke="#A7F3D0" stroke-width="1.4" opacity=".35"/>
    <path d="M56 64A77 77 0 0 1 170 55" fill="none" stroke="#D1FAE5" stroke-width="2" stroke-linecap="round" opacity=".5"/>
    <text x="112" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="800" letter-spacing="1" fill="#FFFFFF">LF</text>
    <path d="M79 143H145" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
    <circle cx="112" cy="165" r="3" fill="#D1FAE5"/>
  </g>
  <text x="204" y="373" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#8BBFA8" opacity=".8">INTELLIGENCE IN MOTION</text>

  <!-- Main brand message -->
  <g>
    <text x="370" y="183" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="2.2" fill="#F3FFF8">LOGIXA</text>
    <text x="370" y="264" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="2.2" fill="url(#mint)">FLOW</text>
    <rect x="374" y="289" width="82" height="4" rx="2" fill="url(#mint)"/>
    <text x="374" y="329" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.8" fill="#D5EDE1">AI-POWERED FLOW AUTOMATION PLATFORM</text>
    <text x="374" y="365" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" letter-spacing=".5" fill="#91B7A5">Smarter Supply Chain. Limitless Flow.</text>

    <!-- Capability pills -->
    <g transform="translate(374 398)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
      <rect width="185" height="34" rx="17" fill="#10B981" fill-opacity=".14" stroke="#6EE7B7" stroke-opacity=".48"/>
      <text x="92.5" y="22" text-anchor="middle" fill="#B7F7D8">SUPPLY CHAIN AI</text>
      <rect x="197" width="184" height="34" rx="17" fill="#10B981" fill-opacity=".11" stroke="#6EE7B7" stroke-opacity=".38"/>
      <text x="289" y="22" text-anchor="middle" fill="#B7F7D8">AGENT ORCHESTRATION</text>
      <rect x="393" width="174" height="34" rx="17" fill="#10B981" fill-opacity=".11" stroke="#6EE7B7" stroke-opacity=".38"/>
      <text x="480" y="22" text-anchor="middle" fill="#B7F7D8">WORKFLOW AUTOMATION</text>
    </g>
  </g>

  <!-- Right-side supply-chain and AI workflow illustration -->
  <g transform="translate(1000 52)">
    <!-- Route map -->
    <g fill="none" stroke="#6EE7B7" stroke-width="1.8" stroke-opacity=".45" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 104L174 54L276 105L388 57L445 124"/>
      <path d="M64 104L124 221L244 258L350 207L445 124"/>
      <path d="M174 54L194 164L276 105L350 207"/>
      <path d="M124 221L194 164L276 105"/>
      <path d="M244 258L276 105L388 57"/>
    </g>
    <g fill="#10B981" stroke="#B7F7D8" stroke-width="1.5">
      <circle cx="64" cy="104" r="6"/><circle cx="174" cy="54" r="6"/><circle cx="276" cy="105" r="7"/>
      <circle cx="388" cy="57" r="6"/><circle cx="445" cy="124" r="6"/><circle cx="124" cy="221" r="6"/>
      <circle cx="194" cy="164" r="6"/><circle cx="244" cy="258" r="6"/><circle cx="350" cy="207" r="6"/>
    </g>

    <!-- Central AI orchestration node -->
    <g transform="translate(224 78)" filter="url(#shadow)">
      <circle cx="52" cy="52" r="65" fill="#10B981" opacity=".16" filter="url(#glow)"/>
      <circle cx="52" cy="52" r="43" fill="#09271D" stroke="#6EE7B7" stroke-width="2"/>
      <circle cx="52" cy="52" r="33" fill="url(#emblem)" opacity=".95"/>
      <path d="M39 39H65M39 52H65M39 65H56" stroke="#E5FFF1" stroke-width="3" stroke-linecap="round"/>
      <circle cx="71" cy="34" r="4" fill="#D1FAE5"/>
    </g>

    <!-- Warehouse / container stack -->
    <g transform="translate(6 286)" filter="url(#shadow)">
      <path d="M0 28L52 0L104 28V91H0Z" fill="url(#panel)" stroke="#3B9B72" stroke-opacity=".85"/>
      <path d="M0 28L52 56L104 28M52 56V91" fill="none" stroke="#6EE7B7" stroke-opacity=".55"/>
      <path d="M14 31V78M27 38V84M77 38V84M90 31V78" stroke="#6EE7B7" stroke-opacity=".35"/>
      <path d="M16 18L52 0L88 18" fill="none" stroke="#A7F3D0" stroke-opacity=".7"/>
    </g>
    <g transform="translate(130 318)">
      <rect width="118" height="66" rx="5" fill="#0A2D21" stroke="#4CB98A" stroke-width="1.4"/>
      <path d="M18 0V66M36 0V66M54 0V66M72 0V66M90 0V66" stroke="#6EE7B7" stroke-opacity=".3"/>
      <path d="M0 17H118M0 49H118" stroke="#6EE7B7" stroke-opacity=".22"/>
      <rect x="13" y="12" width="22" height="8" rx="2" fill="#10B981" opacity=".65"/>
    </g>
    <g transform="translate(278 294)">
      <path d="M0 22L45 0L90 22V89H0Z" fill="#0B3023" stroke="#4CB98A" stroke-width="1.4"/>
      <path d="M0 22L45 45L90 22M45 45V89" fill="none" stroke="#6EE7B7" stroke-opacity=".48"/>
      <path d="M15 29V76M30 37V82M60 37V82M75 29V76" stroke="#6EE7B7" stroke-opacity=".3"/>
    </g>

    <!-- Small telemetry card -->
    <g transform="translate(334 246)" filter="url(#shadow)">
      <rect width="126" height="78" rx="8" fill="#071B14" stroke="#2F8D67" stroke-opacity=".9"/>
      <circle cx="15" cy="17" r="3" fill="#6EE7B7"/>
      <text x="25" y="20" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="1.1" fill="#A7F3D0">LIVE FLOW</text>
      <path d="M14 58L32 47L47 53L64 34L81 42L108 27" fill="none" stroke="#6EE7B7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 58L32 47L47 53L64 34L81 42L108 27V64H14Z" fill="#10B981" fill-opacity=".12"/>
      <circle cx="108" cy="27" r="3.5" fill="#A7F3D0"/>
    </g>

    <!-- Motion / data particles -->
    <g fill="#A7F3D0">
      <circle cx="20" cy="145" r="2.2" opacity=".8"/><circle cx="468" cy="186" r="2" opacity=".65"/>
      <circle cx="292" cy="18" r="2" opacity=".55"/><circle cx="470" cy="290" r="2.5" opacity=".7"/>
      <circle cx="90" cy="270" r="1.8" opacity=".6"/>
    </g>
  </g>

  <!-- Fine frame accents -->
  <path d="M0 1H1500" stroke="#A7F3D0" stroke-opacity=".52"/>
  <path d="M0 499H1500" stroke="#10B981" stroke-opacity=".55"/>
  <path d="M18 18H90M18 18V90M1410 18H1482V90" fill="none" stroke="#6EE7B7" stroke-opacity=".24" stroke-width="1.4"/>
</svg>