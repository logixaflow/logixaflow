<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Logixa Flow — Multi-Agent Workflow Orchestration</title>
  <desc id="desc">A dark green technology banner featuring the Logixa Flow LF monogram and a subtle connected workflow network.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071610"/>
      <stop offset=".55" stop-color="#0A2119"/>
      <stop offset="1" stop-color="#06120E"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="logoBg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#064E3B"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#10B981" stop-opacity=".22"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#background)"/>
  <ellipse cx="225" cy="200" rx="235" ry="190" fill="url(#halo)" filter="url(#softGlow)"/>
  <path d="M0 324 C220 260 330 355 520 295 S900 235 1200 285" fill="none" stroke="#10B981" stroke-opacity=".09" stroke-width="1.5"/>
  <path d="M0 345 C240 282 365 378 560 318 S940 258 1200 308" fill="none" stroke="#6EE7B7" stroke-opacity=".06" stroke-width="1"/>
  <g stroke="#6EE7B7" stroke-opacity=".09" stroke-width="1">
    <path d="M760 0V400 M900 0V400 M1040 0V400"/>
    <path d="M650 100H1200 M650 200H1200 M650 300H1200"/>
  </g>

  <!-- Logixa Flow monogram, matched to assets/logo.svg -->
  <g transform="translate(105 92)">
    <circle cx="100" cy="100" r="100" fill="#10B981" opacity=".12" filter="url(#softGlow)"/>
    <circle cx="100" cy="100" r="92" fill="none" stroke="#6EE7B7" stroke-width="2" opacity=".65"/>
    <circle cx="100" cy="100" r="85" fill="none" stroke="#10B981" stroke-width="1" opacity=".55"/>
    <circle cx="100" cy="100" r="82" fill="url(#logoBg)"/>
    <circle cx="100" cy="100" r="70" fill="none" stroke="#6EE7B7" stroke-width="1.5" opacity=".34"/>
    <text x="100" y="111" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="2" fill="#FFFFFF">LF</text>
    <path d="M70 128H130" stroke="#A7F3D0" stroke-width="2" opacity=".75"/>
  </g>

  <g>
    <text x="350" y="166" font-family="Inter, Arial, Helvetica, sans-serif" font-size="65" font-weight="800" letter-spacing="1.5" fill="#F4FFF9">LOGIXA</text>
    <text x="350" y="232" font-family="Inter, Arial, Helvetica, sans-serif" font-size="65" font-weight="800" letter-spacing="1.5" fill="url(#mint)" filter="url(#textGlow)">FLOW</text>
    <text x="354" y="272" font-family="Inter, Arial, Helvetica, sans-serif" font-size="17" font-weight="500" letter-spacing="2.2" fill="#C3D9CF">MULTI-AGENT WORKFLOW ORCHESTRATION</text>
    <g transform="translate(354 302)" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">
      <rect width="128" height="29" rx="14.5" fill="#10B981" fill-opacity=".13" stroke="#10B981" stroke-opacity=".55"/>
      <text x="64" y="19" text-anchor="middle" fill="#A7F3D0">AGENT ROUTING</text>
      <rect x="140" width="132" height="29" rx="14.5" fill="#10B981" fill-opacity=".10" stroke="#10B981" stroke-opacity=".4"/>
      <text x="206" y="19" text-anchor="middle" fill="#A7F3D0">RAG PIPELINES</text>
      <rect x="284" width="142" height="29" rx="14.5" fill="#10B981" fill-opacity=".10" stroke="#10B981" stroke-opacity=".4"/>
      <text x="355" y="19" text-anchor="middle" fill="#A7F3D0">SEMANTIC CACHE</text>
      <rect x="438" width="150" height="29" rx="14.5" fill="#10B981" fill-opacity=".10" stroke="#10B981" stroke-opacity=".4"/>
      <text x="513" y="19" text-anchor="middle" fill="#A7F3D0">RESILIENT QUEUES</text>
    </g>
  </g>

  <!-- Subtle connected workflow motif -->
  <g fill="none" stroke="#6EE7B7" stroke-width="1.5" stroke-opacity=".32">
    <path d="M930 132H1010L1050 172H1120"/>
    <path d="M930 200H1000L1040 240H1120"/>
    <path d="M930 268H990L1030 228H1120"/>
    <path d="M1010 132V200"/>
  </g>
  <g fill="#10B981" stroke="#A7F3D0" stroke-width="1.2">
    <circle cx="930" cy="132" r="5"/><circle cx="930" cy="200" r="5"/><circle cx="930" cy="268" r="5"/>
    <circle cx="1010" cy="132" r="5"/><circle cx="1050" cy="172" r="5"/>
    <circle cx="1000" cy="200" r="5"/><circle cx="1040" cy="240" r="5"/>
    <circle cx="990" cy="268" r="5"/><circle cx="1030" cy="228" r="5"/>
    <circle cx="1120" cy="172" r="5"/><circle cx="1120" cy="240" r="5"/><circle cx="1120" cy="228" r="5"/>
  </g>
  <path d="M0 1H1200" stroke="#6EE7B7" stroke-opacity=".42"/>
  <path d="M0 399H1200" stroke="#10B981" stroke-opacity=".28"/>
</svg>
